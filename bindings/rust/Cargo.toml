[package]
name = "voyag-rs"
version = "8.0.0"
edition = "2021"
description = "Voyag V8 local inference binding for Rust"
license = "Apache-2.0"

[dependencies]
# Metaspace BPE tokenizer, same engine family as the Python `tokenizers` lib.
# default-features=false drops the http downloader; onig is kept for regex splits.
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# ONNX Runtime bindings; default features download the prebuilt runtime at build
# time. Build on Windows/Linux/macOS with plain `cargo build --release`.
ort = { version = "2.0.0-rc.10" }
# preserve_order keeps schema slot/criteria order identical to the JSON file,
# which is required for tokenization parity with Python.
serde_json = { version = "1", features = ["preserve_order"] }

[lib]
name = "voyag"
path = "src/lib.rs"

[[bin]]
name = "voyag-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
